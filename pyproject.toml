[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guiless-search"
version = "0.1.0"
description = "Multi-backend headless web search proxy"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{name = "Zhou Qiankang", email = "wszqkzqk@qq.com"}]
dependencies = [
    "PySide6>=6.2",
]

[project.scripts]
guiless-search = "guiless_search.__main__:main"

[tool.setuptools.packages.find]
